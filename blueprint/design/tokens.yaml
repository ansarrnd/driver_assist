# Design tokens

```yaml
meta:
  color_mode: dark
  material_version: "3-like semantic roles"
  typography_family: Outfit   # geometric sans; fallback system sans OK

shared:
  glass:
    blur: 15
    opacity: 0.1
    border_radius: 10
  button_radius: 8
  input_radius: 8
  input_fill_opacity: 0.1
  nav:
    elevation: 10
    unselected_opacity: 0.7

layout:
  root_navigation: bottom_tabs
  tabs:
    - id: schedule
      label: Schedule
      icon: drive / car
    - id: add
      label: Add
      icon: add_circle_outline
    - id: settings
      label: Settings
      icon: settings
  schedule_subtabs: [Trips, Tickets]
  schedule_period_filter:
    default: Month
    options: [Today, Week, Month]

components:
  glass_card:
    usage: schedule list rows, add form shell, settings rows
    interaction: tap to edit; swipe-end-to-start to delete (manage screen)
  empty_state:
    icon: directions_car_outlined (schedule) / inbox (manage)
    title: "No drive schedules available." # schedule
  theme_chip:
    shape: pill / rounded 16
    shows: color dot + team code
    selected: border + tinted fill in team color

themes:
  rcb:
    label: RCB
    seed: "#E50E2F"
    secondary: "#D4AF37"
    background: "#1A1A1A"
    app_bar_text: "#D4AF37"
    button_text: "#FFFFFF"
    gradient: ["#1A1A1A", "#8B0000"]
  csk:
